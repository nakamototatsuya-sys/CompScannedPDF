name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name CompScannedPDF CompScannedPDF.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist\CompScannedPDF.exe, register.bat, unregister.bat, README.md release\
          Compress-Archive -Path release\* -DestinationPath CompScannedPDF-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CompScannedPDF-windows
          path: CompScannedPDF-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CompScannedPDF-windows.zip
